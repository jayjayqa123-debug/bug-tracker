<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bug Tracker - Sign In</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <h1>🐞 Bug Tracker Board</h1>
    <div class="tabs">
      <button id="tabLogin" class="active">Sign In</button>
      <button id="tabRegister">Register</button>
    </div>

    <!-- GOOGLE (shown only when GOOGLE_CLIENT_ID is configured on the server) -->
    <div id="googleArea" style="display:none;">
      <div id="googleBtn" style="display:flex;justify-content:center;"></div>
      <div class="divider"><span>or use email</span></div>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button class="primary" type="submit">Sign In</button>
      <div style="text-align:center;margin-top:12px;"><a href="#" id="forgotLink" class="small-link">Forgot password?</a></div>
      <div class="msg" id="loginMsg"></div>
    </form>

    <!-- FORGOT PASSWORD -->
    <form id="forgotForm" style="display:none;">
      <p style="margin-top:0;color:var(--muted);font-size:14px;">Enter your account email. The QA Admin will see your request and give you a temporary password.</p>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="forgotEmail" required>
      </div>
      <button class="primary" type="submit">Request Password Reset</button>
      <div style="text-align:center;margin-top:12px;"><a href="#" id="forgotBack" class="small-link">Back to sign in</a></div>
      <div class="msg" id="forgotMsg"></div>
    </form>

    <!-- CHANGE PASSWORD (forced after an admin reset) -->
    <form id="changeForm" style="display:none;">
      <p style="margin-top:0;color:var(--muted);font-size:14px;">Your password was reset by the QA Admin. Please choose a new password to continue.</p>
      <div class="form-group">
        <label>Temporary password</label>
        <input type="password" id="chgCurrent" required autocomplete="current-password">
      </div>
      <div class="form-group">
        <label>New password (min. 6 characters)</label>
        <input type="password" id="chgNew" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>Confirm new password</label>
        <input type="password" id="chgConfirm" required minlength="6" autocomplete="new-password">
      </div>
      <button class="primary" type="submit">Save New Password</button>
      <div style="text-align:center;margin-top:12px;"><a href="#" id="chgSignOut" class="small-link">Sign out</a></div>
      <div class="msg" id="changeMsg"></div>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" style="display:none;">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="regName" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" required>
      </div>
      <div class="form-group">
        <label>I am a...</label>
        <select id="regRole">
          <option value="QA">QA (files tickets)</option>
          <option value="Dev">Developer (gets assigned tickets)</option>
        </select>
      </div>
      <div class="form-group" id="regPlatformWrap">
        <label>Which platform do you develop for?</label>
        <select id="regPlatform">
          <option value="Android">Android</option>
          <option value="iOS">iOS</option>
          <option value="Web">Web</option>
        </select>
      </div>
      <button class="primary" type="submit">Create Account</button>
      <div class="msg" id="registerMsg"></div>
    </form>

    <!-- COMPLETE ACCOUNT (first-time Google users pick role/platform) -->
    <form id="googleCompleteForm" style="display:none;">
      <p id="googleWelcome" style="margin-top:0;color:var(--muted);font-size:14px;"></p>
      <div class="form-group">
        <label>I am a...</label>
        <select id="gRole">
          <option value="QA">QA (files tickets)</option>
          <option value="Dev">Developer (gets assigned tickets)</option>
        </select>
      </div>
      <div class="form-group" id="gPlatformWrap">
        <label>Which platform do you develop for?</label>
        <select id="gPlatform">
          <option value="Android">Android</option>
          <option value="iOS">iOS</option>
          <option value="Web">Web</option>
        </select>
      </div>
      <button class="primary" type="submit">Finish &amp; Continue</button>
      <div class="msg" id="googleMsg"></div>
    </form>
  </div>

  <script src="js/pwtoggle.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
