<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bug Tracker - Authentication</title>
  <script>
    document.documentElement.setAttribute('data-theme',
      localStorage.getItem('theme') ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <h1>🐛 Bug Tracker</h1>

      <button id="theme-toggle" class="floating" aria-label="Toggle dark mode">🌙</button>

    <!-- Tabs Navigation -->
    <div class="tabs">
      <button class="tab-btn active" id="tabLogin" type="button">Sign In</button>
      <button class="tab-btn" id="tabRegister" type="button">Register</button>
    </div>

    <!-- Google sign-in (shown only when configured) -->
    <div id="googleArea" style="display: none;">
      <div id="googleBtn" style="display:flex;justify-content:center;"></div>
      <div class="divider"><span>or use email</span></div>
    </div>

    <!-- Login Form -->
    <form id="loginForm">
      <div id="loginMsg" class="msg"></div>
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required placeholder="name@company.com">
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-primary">Sign In</button>
      <div class="auth-links">
        <a href="#" id="forgotLink">Forgot password?</a>
      </div>
    </form>

    <!-- Register Form -->
    <form id="registerForm" style="display: none;">
      <div id="registerMsg" class="msg"></div>
      <div class="form-group">
        <label for="regName">Name</label>
        <input type="text" id="regName" required placeholder="John Doe">
      </div>
      <div class="form-group">
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" required placeholder="name@company.com">
      </div>
      <div class="form-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" required placeholder="••••••••">
      </div>
      <div class="form-group">
        <label for="regRole">Role</label>
        <select id="regRole">
          <option value="QA">QA</option>
          <option value="Dev">Dev</option>
        </select>
      </div>
      <div class="form-group" id="regPlatformWrap" style="display: none;">
        <label for="regPlatform">Platform</label>
        <select id="regPlatform">
          <option value="Android">Android</option>
          <option value="iOS">iOS</option>
          <option value="Web">Web</option>
          <option value="77 Live Android">77 Live Android</option>
          <option value="77 Live iOS">77 Live iOS</option>
        </select>
      </div>
      <button type="submit" class="btn-primary">Create Account</button>
    </form>

    <!-- Forgot Password Form -->
    <form id="forgotForm" style="display: none;">
      <div id="forgotMsg" class="msg"></div>
      <p class="sub-text">Enter your email address and we'll send you instructions to reset your password.</p>
      <div class="form-group">
        <label for="forgotEmail">Email</label>
        <input type="email" id="forgotEmail" required placeholder="name@company.com">
      </div>
      <button type="submit" class="btn-primary">Reset Password</button>
      <div class="auth-links" style="text-align: center; margin-top: 10px;">
        <a href="#" id="forgotBack">← Back to Sign In</a>
      </div>
    </form>

    <!-- Forced / Manual Password Change Form -->
    <form id="changeForm" style="display: none;">
      <div id="changeMsg" class="msg"></div>
      <p class="sub-text">You must change your password before continuing.</p>
      <div class="form-group">
        <label for="chgCurrent">Current Password</label>
        <input type="password" id="chgCurrent" required>
      </div>
      <div class="form-group">
        <label for="chgNew">New Password</label>
        <input type="password" id="chgNew" required>
      </div>
      <div class="form-group">
        <label for="chgConfirm">Confirm New Password</label>
        <input type="password" id="chgConfirm" required>
      </div>
      <button type="submit" class="btn-primary">Update Password</button>
      <div style="margin-top: 10px; text-align: center;">
        <button type="button" class="btn-secondary" id="chgSignOut">Sign Out</button>
      </div>
    </form>

    <!-- Google Complete Profile Form -->
    <form id="googleCompleteForm" style="display: none;">
      <div id="googleMsg" class="msg"></div>
      <p class="sub-text" id="googleWelcome"></p>
      <div class="form-group">
        <label for="gRole">Role</label>
        <select id="gRole">
          <option value="QA">QA</option>
          <option value="Dev">Dev</option>
        </select>
      </div>
      <div class="form-group" id="gPlatformWrap" style="display: none;">
        <label for="gPlatform">Platform</label>
        <select id="gPlatform">
          <option value="Android">Android</option>
          <option value="iOS">iOS</option>
          <option value="Web">Web</option>
          <option value="77 Live Android">77 Live Android</option>
          <option value="77 Live iOS">77 Live iOS</option>
        </select>
      </div>
      <button type="submit" class="btn-primary">Complete Setup</button>
    </form>

  </div>

  <script src="js/pwtoggle.js"></script>
  <script src="js/auth.js"></script>
  <script src="/js/theme.js"></script>
</body>
</html>
