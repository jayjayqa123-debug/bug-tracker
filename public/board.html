<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bug Tracker Board</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand-nav">
    <h1>🐛 Bug Tracker</h1>
    <nav class="view-menu">
      <a href="board.html" class="nav-link active">Board</a>
      <a href="list.html" class="nav-link">List of Bugs</a>
    </nav>
  </div>
  <div class="platform-tabs" id="platformTabs">
    <button data-platform="Android" class="active">Android</button>
    <button data-platform="iOS">iOS</button>
    <button data-platform="Web">Web</button>
    <button data-platform="77 Live Android">77 Live Android</button>
    <button data-platform="77 Live iOS">77 Live iOS</button>
  </div>
  <div class="top-actions">
    <span class="who" id="whoAmI"></span>
    <button id="adminBtn" style="display:none;">Admin</button>
    <button id="backupBtn" style="display:none;" title="Download a backup of all filed tickets">⬇ Backup</button>
    <button id="exportBtn">Export CSV</button>
    <button class="cta" id="newTicketBtn">+ File Ticket</button>
    <button id="logoutBtn">Log Out</button>
  </div>
</header>

<div class="stats-bar" id="statsBar">
  <div class="stat-card"><div class="num" id="filedTodayCount">0</div><div class="label">FILED TODAY</div></div>
  <div class="stat-card"><div class="num" id="fixedTodayCount">0</div><div class="label">FIXED TODAY</div></div>
  <div class="stat-card"><div class="num" id="totalFixedCount">0</div><div class="label">TOTAL FIXED</div></div>
  <div class="stat-card"><div class="num" id="stillActiveCount">0</div><div class="label">STILL ACTIVE</div></div>
  <div class="stat-card"><div class="num" id="reactiveCount">0</div><div class="label">RE-ACTIVE</div></div>
  <div class="stat-card"><div class="num" id="closedTodayCount">0</div><div class="label">CLOSED TODAY</div></div>
  <div class="stat-card"><div class="num" id="pendingRegressionCount">0</div><div class="label">PENDING REGRESSION</div></div>
  <div class="stat-card"><div class="num" id="totalClosedCount">0</div><div class="label">TOTAL CLOSED</div></div>
  <div class="stat-card"><div class="num" id="totalCount">0</div><div class="label">TOTAL</div></div>
</div>

<div class="board" id="board"></div>

<button class="fab" id="fabAdd" title="File a new ticket">+</button>

<!-- Ticket Details / File Ticket Modal Overlay -->
<div class="overlay" id="ticketOverlay">
  <div class="modal">
    <div class="modal-header">
      <button type="button" class="btn-back" id="backBtn" title="Back to board">← Back</button>
      <h2 id="modalTitle">File New Ticket</h2>
    </div>
    <form id="ticketForm">
      <div class="form-group">
        <label for="tNumber">Ticket No.</label>
        <input type="text" id="tNumber" disabled>
      </div>
      <div class="form-group">
        <label for="tTitle">Title</label>
        <textarea id="tTitle" rows="2" class="full-title-input" required></textarea>
      </div>
      <div class="form-group">
        <label for="tDescription">Description</label>
        <textarea id="tDescription" rows="4"></textarea>
      </div>
      <div class="form-group">
        <label>Attachments</label>
        <div class="attach-actions">
          <button type="button" class="btn-attach" id="addLinkBtn">🔗 Link</button>
          <button type="button" class="btn-attach" id="addImageBtn">📷 Image</button>
          <button type="button" class="btn-attach" id="addVideoBtn">🎥 Video</button>
        </div>
        <input type="file" id="imageInput" accept="image/jpeg,image/png,image/gif,image/webp" multiple hidden>
        <input type="file" id="videoInput" accept="video/mp4,video/webm,video/quicktime,video/ogg" multiple hidden>
        <div class="link-row" id="linkRow" style="display:none;">
          <input type="url" id="linkInput" placeholder="https://example.com/...">
          <button type="button" class="btn-attach" id="linkAddBtn">Add</button>
        </div>
        <div class="attach-list" id="attachList"></div>
        <div class="attach-status" id="attachStatus"></div>
      </div>
      <div class="row">
        <div class="form-group">
          <label for="tPriority">Priority</label>
          <select id="tPriority">
            <option>Low</option>
            <option selected>Medium</option>
            <option>High</option>
            <option>Urgent</option>
          </select>
        </div>
        <div class="form-group">
          <label for="tSeverity">Severity</label>
          <select id="tSeverity">
            <option selected>Minor</option>
            <option>Major</option>
            <option>Critical</option>
            <option>Blocker</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="tAssignee">Assignee (Dev)</label>
        <select id="tAssignee"><option value="">Unassigned</option></select>
      </div>
      <div class="form-group">
        <label for="tStatus">Status</label>
        <select id="tStatus"></select>
      </div>
      <div class="form-group" id="filedByWrap" style="display:none;">
        <label for="tFiledBy">Filed By</label>
        <input type="text" id="tFiledBy" disabled>
      </div>
      <div class="form-group" id="shareWrap" style="display:none;">
        <label for="tShareLink">Shareable Link</label>
        <input type="text" id="tShareLink" readonly>
      </div>
      <div class="form-group" id="commentsWrap" style="display:none;">
        <label>Comments (QA &amp; Dev)</label>
        <div class="comment-list" id="commentList"></div>
        <textarea id="commentInput" rows="2" maxlength="2000" placeholder="Write a comment…"></textarea>
        <div class="comment-actions">
          <span class="attach-status" id="commentStatus"></span>
          <button type="button" class="btn-attach" id="commentSendBtn">Post comment</button>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-danger" id="deleteBtn" style="display:none;">Delete</button>
        <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn-save">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="js/presence.js"></script>
<script src="js/board.js"></script>
</body>
</html>
